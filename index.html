<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إبراهيم القصاص | أتمتة أعمال</title>
<meta name="description" content="أساعد أصحاب الأعمال على بناء حلول وزيادة الإنتاجية باستخدام الأتمتة والذكاء الاصطناعي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0f3d24;      /* الأخضر الغابي */
  --forest-deep:#0a2b19;
  --forest-card:#14482b;
  --lime:#c8f56a;        /* الأخضر الليموني الخفيف */
  --lime-dim:#a9d94f;
  --text:#eef7ef;
  --muted:#a6c4b0;
  --line:rgba(200,245,106,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--forest);
  color:var(--text);
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* الشريط العلوي */
header{position:sticky;top:0;z-index:10;background:rgba(15,61,36,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-weight:800;font-size:1.05rem}
.lang{
  font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;
  background:transparent;color:var(--lime);border:1.5px solid var(--lime);
  padding:4px 16px;border-radius:999px;
}
.lang:hover{background:var(--lime);color:var(--forest-deep)}

/* الواجهة */
.hero{padding:48px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.3rem,6vw,3.8rem);font-weight:800;line-height:1.15}
.hero .role{margin-top:10px;font-size:1.25rem;font-weight:600;color:var(--lime)}
.hero p.about{margin-top:18px;font-size:1.1rem;color:var(--muted);max-width:30em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{
  display:inline-block;padding:11px 24px;border-radius:999px;font-weight:700;font-size:1rem;
  border:2px solid var(--lime);transition:background .2s,color .2s;
}
.btn.fill{background:var(--lime);color:var(--forest-deep)}
.btn.fill:hover{background:var(--text);border-color:var(--text)}
.btn.line{color:var(--lime)}
.btn.line:hover{background:var(--lime);color:var(--forest-deep)}
.photo{justify-self:center;width:min(100%,340px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  border:3px solid var(--lime);box-shadow:0 0 60px rgba(200,245,106,.25)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

/* الأقسام */
section{padding:56px 0}
section.alt{background:var(--forest-deep)}
h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
.sub{margin-top:6px;color:var(--muted)}

/* المشاريع */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-top:30px}
.card{
  background:var(--forest-card);border-radius:18px;padding:24px;
  border-inline-start:5px solid var(--lime);
  display:flex;flex-direction:column;gap:12px;
}
.card h3{font-size:1.25rem;font-weight:800}
.card p{color:var(--muted);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:.85rem;padding:2px 12px;border-radius:999px;background:rgba(200,245,106,.14);color:var(--lime)}
.card .go{align-self:flex-start;font-weight:700;color:var(--lime);border-bottom:2px solid var(--lime)}
.card .go:hover{color:var(--text);border-color:var(--text)}
.card.soon{background:transparent;border:2px dashed var(--line);border-inline-start:2px dashed var(--line)}
.card.soon h3{color:var(--muted)}
.badge{align-self:flex-start;font-size:.8rem;font-weight:700;padding:2px 12px;border-radius:999px;background:var(--lime);color:var(--forest-deep)}
.soon .badge{background:transparent;color:var(--lime);border:1.5px solid var(--lime)}

/* التواصل */
.contact-list{margin-top:26px;border-top:1px solid var(--line)}
.contact-list a{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:18px 4px;border-bottom:1px solid var(--line);font-size:1.15rem;font-weight:600;
  transition:padding .2s,color .2s;
}
.contact-list a span:last-child{color:var(--muted);font-weight:400;font-size:1rem;direction:ltr;unicode-bidi:plaintext;overflow-wrap:anywhere}
.contact-list a:hover{color:var(--lime);padding-inline:14px}

footer{padding:26px 0;text-align:center;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

@media (max-width:760px){
  .hero .wrap{grid-template-columns:1fr;gap:28px}
  .photo{order:-1;width:min(70%,260px)}
  .hero{padding-top:28px}
  .hero .wrap>div:first-child{text-align:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="brand" id="brand"></span>
    <button class="lang" id="langBtn" type="button"></button>
  </div>
</header>

<main>
  <div class="hero">
    <div class="wrap">
      <div>
        <h1 id="name"></h1>
        <div class="role" id="role"></div>
        <p class="about" id="about"></p>
        <div class="cta">
          <a class="btn fill" id="ctaWa" href="https://wa.me/972597219615" target="_blank" rel="noopener"></a>
          <a class="btn line" id="ctaProjects" href="#projects"></a>
        </div>
      </div>
      <div class="photo"><img src="photo.png" alt="" id="photoImg" width="680" height="680"></div>
    </div>
  </div>

  <section class="alt" id="projects">
    <div class="wrap">
      <h2 id="projectsTitle"></h2>
      <p class="sub" id="projectsSub"></p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2 id="contactTitle"></h2>
      <p class="sub" id="contactSub"></p>
      <div class="contact-list">
        <a href="https://wa.me/972597219615" target="_blank" rel="noopener"><span id="cWa"></span><span>+972 59 721 9615</span></a>
        <a href="mailto:qassasebrhem@gmail.com"><span id="cMail"></span><span>qassasebrhem@gmail.com</span></a>
        <a href="https://www.instagram.com/ibrhim_a_qassas" target="_blank" rel="noopener"><span>Instagram</span><span>@ibrhim_a_qassas</span></a>
        <a href="https://www.facebook.com/share/1JJLmQffCf/" target="_blank" rel="noopener"><span>Facebook</span><span id="cFb"></span></a>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<script>
/* =====================================================================
   ✅ إضافة مشروع جديد:
   انسخ أحد البلوكات داخل PROJECTS (من { إلى },) والصقه في آخر القائمة
   وغيّر النصوص. status: "done" = مشروع جاهز، "soon" = قادم قريباً.
   link: رابط المشروع على GitHub (اتركه "" لإخفاء الزر).
   ===================================================================== */
const PROJECTS = [
  {
    status: "soon",
    title: { ar: "مشروع قادم", en: "Upcoming Project" },
    desc:  { ar: "أعمل حالياً على فكرة جديدة، تابعني.",
             en: "A new idea is in the works. Stay tuned." },
    tools: [],
    link: ""
  },
  {
    status: "soon",
    title: { ar: "مشروع قادم", en: "Upcoming Project" },
    desc:  { ar: "أعمل حالياً على فكرة جديدة، تابعني.",
             en: "A new idea is in the works. Stay tuned." },
    tools: [],
    link: ""
  }
];

const T = {
  ar: {
    dir:"rtl", btn:"English", title:"إبراهيم القصاص | أتمتة أعمال",
    brand:"إبراهيم القصاص", name:"إبراهيم القصاص", role:"أتمتة أعمال",
    about:"أساعد أصحاب الأعمال على بناء حلول وزيادة الإنتاجية باستخدام الأتمتة والذكاء الاصطناعي.",
    ctaWa:"تواصل معي على واتساب", ctaProjects:"شاهد مشاريعي",
    projectsTitle:"مشاريعي", projectsSub:"حلول أتمتة بنيتها وأعمل على المزيد.",
    contactTitle:"تواصل معي", contactSub:"عندك عمل بدك تسهّل شغلو؟ راسلني.",
    cWa:"واتساب", cMail:"البريد الإلكتروني", cFb:"إبراهيم القصاص",
    done:"جاهز", soon:"قريباً", view:"افتح المشروع",
    foot:"© " + new Date().getFullYear() + " إبراهيم القصاص", alt:"صورة إبراهيم القصاص"
  },
  en: {
    dir:"ltr", btn:"العربية", title:"Ibrahim Al-Qassas | Business Automation",
    brand:"Ibrahim Al-Qassas", name:"Ibrahim Al-Qassas", role:"Business Automation",
    about:"I help business owners build solutions and boost productivity with automation and AI.",
    ctaWa:"Message me on WhatsApp", ctaProjects:"See my projects",
    projectsTitle:"My Projects", projectsSub:"Automation solutions I’ve built, and more on the way.",
    contactTitle:"Get in touch", contactSub:"Have a process you want to simplify? Send me a message.",
    cWa:"WhatsApp", cMail:"Email", cFb:"Ibrahim Al-Qassas",
    done:"Live", soon:"Coming soon", view:"Open project",
    foot:"© " + new Date().getFullYear() + " Ibrahim Al-Qassas", alt:"Photo of Ibrahim Al-Qassas"
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.title = t.title;
  $("langBtn").textContent = t.btn;
  ["brand","name","role","about","projectsTitle","projectsSub","contactTitle","contactSub","cWa","cMail","cFb","foot"]
    .forEach(k => $(k).textContent = t[k]);
  $("ctaWa").textContent = t.ctaWa;
  $("ctaProjects").textContent = t.ctaProjects;
  $("photoImg").alt = t.alt;

  $("grid").innerHTML = PROJECTS.map(p => {
    const soon = p.status === "soon";
    const tags = p.tools && p.tools.length ? `<div class="tags">${p.tools.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : "";
    const link = !soon && p.link ? `<a class="go" href="${esc(p.link)}" target="_blank" rel="noopener">${t.view}</a>` : "";
    return `<article class="card${soon ? " soon" : ""}">
      <span class="badge">${soon ? t.soon : t.done}</span>
      <h3>${esc(p.title[lang])}</h3>
      <p>${esc(p.desc[lang])}</p>
      ${tags}${link}
    </article>`;
  }).join("");

  try{ localStorage.setItem("lang", lang); }catch(e){}
}

let lang = "ar";
try{ lang = localStorage.getItem("lang") || "ar"; }catch(e){}
if(!T[lang]) lang = "ar";
render(lang);
$("langBtn").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; render(lang); });
</script>
</body>
</html>
